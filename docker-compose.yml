version: '3.8'

services:
  aggregator:
    build: .
    restart: unless-stopped

    # Secrets and API credentials — never bake into the image
    env_file: .env

    environment:
      # DB and media paths inside the container
      TG_DB_PATH: /app/data/data.db
      TG_PHOTOS_DIR: /app/data/media

      # ── Pipeline intervals (minutes) ──────────────────────────────────────
      # Adjust to taste. All pipelines share one queue, so they never run
      # in parallel and won't fight over the Telegram session.
      SCHEDULER_ADS_INTERVAL_MIN: 60
      SCHEDULER_SERVICES_INTERVAL_MIN: 60
      SCHEDULER_TAXI_INTERVAL_MIN: 30
      SCHEDULER_DEDUP_INTERVAL_MIN: 360

    volumes:
      # Persist SQLite DB and downloaded media between container restarts
      - aggregator_data:/app/data

  tg-bot:
    build:
      context: ../ircom-tg-bot
    restart: unless-stopped

    # Secrets: BOT_TOKEN, ADMIN_CHAT_ID, WEBAPP_URL, API_URL, and optional PORT
    env_file: ../ircom-tg-bot/.env

    environment:
      BOT_DB_PATH: /app/data/bot.db
      # Digest cron schedule (cron syntax, Europe/Moscow timezone)
      # DIGEST_FETCH_CRON: "0 9 * * *"
      # DIGEST_SEND_CRON:  "0 10 * * *"

    ports:
      - "3000:3000"

    volumes:
      - tg_bot_data:/app/data

volumes:
  aggregator_data:
  tg_bot_data:
